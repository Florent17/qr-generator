<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Générateur de Codes QR</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1a202c;
      --muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 560px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafbfc;
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
      background: #fff;
    }

    .row {
      display: flex;
      gap: 14px;
      margin-bottom: 16px;
    }

    .col { flex: 1; }

    .color-row {
      display: flex;
      gap: 14px;
      align-items: flex-end;
    }

    .color-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .color-row label { margin-bottom: 8px; }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-secondary {
      background: #eef2ff;
      color: var(--primary);
      border: 1px solid #c7d2fe;
    }
    .btn-secondary:hover { background: #e0e7ff; }

    .result-area {
      margin-top: 28px;
      display: none;
    }

    .result-area.visible { display: block; }

    .qr-preview {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .qr-preview img {
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      background: #fff;
      max-width: 100%;
      height: auto;
    }

    .result-meta {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .error-msg {
      color: #dc2626;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .error-msg.visible { display: block; }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
      .row, .color-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Générateur de Codes QR</h1>
    <p class="subtitle">Entrez du texte ou une URL, personnalisez, et téléchargez.</p>

    <form id="qrForm" autocomplete="off">
      <label for="text">Texte ou URL</label>
      <input type="text" id="text" name="text" placeholder="https://example.com ou n'importe quel texte..." required />
      <div class="error-msg" id="textError">Ce champ est obligatoire.</div>

      <div class="row">
        <div class="col">
          <label for="size">Taille (pixels)</label>
          <input type="number" id="size" name="size" min="200" max="2048" step="20" value="400" />
        </div>
        <div class="col">
          <label for="ecLevel">Niveau de correction</label>
          <select id="ecLevel" name="ecLevel">
            <option value="L">L – Faible (7 %)</option>
            <option value="M" selected>M – Moyen (15 %)</option>
            <option value="Q">Q – Élevé (25 %)</option>
            <option value="H">H – Très élevé (30 %)</option>
          </select>
        </div>
      </div>

      <div class="color-row">
        <div class="color-box">
          <label for="color">Couleur des modules</label>
          <input type="color" id="color" name="color" value="#000000" />
        </div>
        <div class="color-box">
          <label for="bgColor">Couleur d'arrière-plan</label>
          <input type="color" id="bgColor" name="bgColor" value="#ffffff" />
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary" id="generateBtn">
          <span id="btnText">Générer</span>
          <span class="spinner" id="spinner"></span>
        </button>
        <button type="button" class="btn btn-secondary" id="downloadBtn" disabled>
          Télécharger PNG
        </button>
      </div>
    </form>

    <div class="result-area" id="resultArea">
      <div class="qr-preview">
        <img id="qrImage" alt="Code QR généré" />
      </div>
      <div class="result-meta" id="resultMeta"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('qrForm');
    const textEl = document.getElementById('text');
    const textError = document.getElementById('textError');
    const sizeEl = document.getElementById('size');
    const ecLevelEl = document.getElementById('ecLevel');
    const colorEl = document.getElementById('color');
    const bgColorEl = document.getElementById('bgColor');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const downloadBtn = document.getElementById('downloadBtn');
    const resultArea = document.getElementById('resultArea');
    const qrImage = document.getElementById('qrImage');
    const resultMeta = document.getElementById('resultMeta');

    let lastQrDataUrl = null;

    function showError(el, show) {
      el.classList.toggle('visible', show);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError(textError, false);

      const text = textEl.value.trim();
      if (!text) {
        showError(textError, true);
        textEl.focus();
        return;
      }

      // IO / UX
      generateBtn.disabled = true;
      btnText.textContent = 'Génération…';
      spinner.style.display = 'inline-block';
      downloadBtn.disabled = true;
      resultArea.classList.remove('visible');
      lastQrDataUrl = null;

      const params = new URLSearchParams({
        text,
        size: sizeEl.value,
        color: colorEl.value,
        bgColor: bgColorEl.value,
        ecLevel: ecLevelEl.value,
      });

      try {
        const res = await fetch(`/api/qr?${params.toString()}`);
        const blob = await res.blob();

        if (!res.ok) {
          const err = await blob.text();
          throw new Error(err || 'Erreur réseau');
        }

        const dataUrl = URL.createObjectURL(blob);
        lastQrDataUrl = dataUrl;
        qrImage.src = dataUrl;
        resultMeta.textContent = `Texte encodé : ${text.length > 60 ? text.slice(0, 60) + '…' : text}  ·  ${sizeEl.value}px  ·  correction ${ecLevelEl.value}`;
        resultArea.classList.add('visible');
        downloadBtn.disabled = false;
      } catch (err) {
        resultMeta.textContent = `Échec : ${err.message}`;
        resultArea.classList.add('visible');
      } finally {
        generateBtn.disabled = false;
        btnText.textContent = 'Générer';
        spinner.style.display = 'none';
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastQrDataUrl) return;
      const a = document.createElement('a');
      a.href = lastQrDataUrl;
      a.download = 'qrcode.png';
      a.click();
    });
  </script>
</body>
</html>
